name: Game removal

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  remove:
    # 作者本人 or 管理者の依頼は即削除。それ以外は approved ラベル（トリアージ権限以上）で削除
    if: >
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[削除依頼]') &&
      (github.event.action == 'opened' || github.event.action == 'edited' ||
       (github.event.action == 'labeled' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          gh label create remove-request --color D6334F --description "ゲームの削除依頼" --force -R "$GITHUB_REPOSITORY"
          gh issue edit "$ISSUE_NO" --add-label remove-request -R "$GITHUB_REPOSITORY"

      - name: Check requester permission
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          p=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$LOGIN/permission" --jq .permission 2>/dev/null || echo none)
          case "$p" in admin|maintain|write) echo "authorized=true" >> "$GITHUB_OUTPUT";; *) echo "authorized=false" >> "$GITHUB_OUTPUT";; esac

      - name: Remove and commit
        id: rm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZED: ${{ steps.perm.outputs.authorized }}
          APPROVED: ${{ github.event.action == 'labeled' && 'true' || 'false' }}
          ISSUE_NO: ${{ github.event.issue.number }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/out.txt"
          : > "$out"
          GITHUB_OUTPUT="$out" python3 scripts/game_removal.py check "$RUNNER_TEMP/comment.md"
          action=$(grep -oP '^action=\K.*' "$out" || echo reject)
          if [ "$action" != "remove" ]; then
            echo "action=$action" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          done=false
          for i in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            : > "$out"
            GITHUB_OUTPUT="$out" python3 scripts/game_removal.py remove "$RUNNER_TEMP/comment.md"
            action=$(grep -oP '^action=\K.*' "$out" || echo reject)
            id=$(grep -oP '^game_id=\K.*' "$out" || true)
            if [ "$action" != "remove" ]; then break; fi
            git add -A community.js games
            git commit -qm "Remove game: $id (#$ISSUE_NO)"
            if git push -q origin "HEAD:$BRANCH"; then done=true; break; fi
            sleep $((i * 5))
          done
          if [ "$action" = "remove" ] && [ "$done" != "true" ]; then
            action=failed
            printf '### ⚠️ 削除に失敗しました\n\nリポジトリへの書き込みに失敗しました。管理者が `approved` ラベルを付け直すと再実行されます。\n' > "$RUNNER_TEMP/comment.md"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
          ACTION: ${{ steps.rm.outputs.action }}
          EVENT: ${{ github.event.action }}
        run: |
          [ -s "$RUNNER_TEMP/comment.md" ] || exit 0
          if [ "$EVENT" = "edited" ]; then
            gh issue comment "$ISSUE_NO" --edit-last --body-file "$RUNNER_TEMP/comment.md" -R "$GITHUB_REPOSITORY" \
              || gh issue comment "$ISSUE_NO" --body-file "$RUNNER_TEMP/comment.md" -R "$GITHUB_REPOSITORY"
          else
            gh issue comment "$ISSUE_NO" --body-file "$RUNNER_TEMP/comment.md" -R "$GITHUB_REPOSITORY"
          fi
          case "$ACTION" in
            remove) gh issue close "$ISSUE_NO" --reason completed -R "$GITHUB_REPOSITORY" ;;
            failed) gh issue edit "$ISSUE_NO" --remove-label approved -R "$GITHUB_REPOSITORY" || true ;;
          esac

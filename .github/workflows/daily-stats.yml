name: Daily stats

on:
  schedule:
    - cron: "7 15 * * *" # 毎日 0:07（日本時間）
  workflow_dispatch:

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Record play counts
        run: python3 scripts/daily_stats.py snapshot

      - name: Commit
        id: commit
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats-history.json data/milestones.json
          if git diff --cached --quiet; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -qm "Daily stats $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 5))
            git pull -q --rebase origin "$BRANCH"
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # 記録の保存に成功してから通知する（失敗時に同じ通知が二重に届かないように）
      - name: Notify milestones
        if: steps.commit.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 scripts/daily_stats.py notify
